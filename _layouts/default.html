<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  body {
    font: 14px/1.4 ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    background: #faf9f5;
    color: #3a372f;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 6rem;
  }

  h1, h2 { font-size: 14px; font-weight: 600; }
  h1 { margin: 0 0 1rem; }
  h2 { color: #ff3b00; margin: 1.9rem 0 0.5rem; }

  p { margin: 0 0 0.7rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 0.35rem; }

  a { color: #ff3b00; text-decoration: none; border-bottom: 1px solid rgba(255, 59, 0, 0.35); }
  a:hover { border-bottom-color: #ff3b00; }

  .muted { color: #9a978d; }
</style>
</head>
<body>
{{ content }}
</body>
</html>
